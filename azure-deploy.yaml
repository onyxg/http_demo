apiVersion: containerinstance.azure.com/v1
kind: ContainerGroup
metadata:
  name: http-demo
  namespace: default
spec:
  containers:
  - name: http-demo
    image: <your-container-registry>/http_demo:latest
    ports:
    - containerPort: 9001
    - containerPort: 9002
    env:
    - name: HTTP_PORT
      value: "9001"
    - name: HTTP2_PORT
      value: "9002"
    livenessProbe:
      httpGet:
        path: /health
        port: 9001
      initialDelaySeconds: 3
      periodSeconds: 3
  restartPolicy: Always
  osType: Linux
  imageRegistryCredentials:
  - name: <your-container-registry>
    server: <your-container-registry>.azurecr.io
    username: <your-username>
    password: <your-password>
